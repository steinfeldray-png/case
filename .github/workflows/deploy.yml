name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Publish changed cases
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          ADMIN_KEY: ${{ secrets.VITE_ADMIN_KEY }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then exit 0; fi
          slugs=$(git diff --name-only --diff-filter=AM "$BEFORE" HEAD -- 'cases/*/*' | cut -d/ -f2 | sort -u)
          node scripts/publish-case.mjs $slugs

      - name: Build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_ADMIN_KEY: ${{ secrets.VITE_ADMIN_KEY }}
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          cname: saneuuu.ru
